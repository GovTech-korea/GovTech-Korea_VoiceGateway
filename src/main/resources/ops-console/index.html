<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모민 상담</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="stylesheet" href="ops.css">
</head>
<body data-view="call" data-agent="OFFLINE" data-call="none">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
	<defs>
		<symbol id="i-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></symbol>
		<symbol id="i-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></symbol>
		<symbol id="i-building" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="1"/><path d="M9 22v-4h6v4M8 6h.01M12 6h.01M16 6h.01M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M16 14h.01"/></symbol>
		<symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4"/><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/></symbol>
		<symbol id="i-chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/><path d="M8 11.5h.01M12 11.5h.01M16 11.5h.01"/></symbol>
		<symbol id="i-speaker" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14"/></symbol>
		<symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>
		<symbol id="i-doc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8M8 9h2"/></symbol>
		<symbol id="i-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M12 8v4M12 16h.01"/></symbol>
		<symbol id="i-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></symbol>
		<symbol id="i-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></symbol>
		<symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></symbol>
		<symbol id="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></symbol>
		<symbol id="i-stop" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1"/></symbol>
		<symbol id="i-reset" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></symbol>
		<symbol id="i-badge" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 2.1 3.2-.3.8 3.1 2.8 1.6-1.2 3 1.2 3-2.8 1.6-.8 3.1-3.2-.3L12 22l-2.4-2.1-3.2.3-.8-3.1-2.8-1.6 1.2-3-1.2-3 2.8-1.6.8-3.1 3.2.3z"/><path d="M12 8v4M12 16h.01"/></symbol>
		<symbol id="i-mute" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="m23 9-6 6M17 9l6 6"/></symbol>
		<symbol id="i-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M8 13l2 2 4-4"/></symbol>
	</defs>
</svg>

<aside class="side">
	<div class="brand"><img src="img/app-icon.png" alt=""><span>모민</span></div>
	<nav>
		<button class="nav-item" data-go="call"><svg><use href="#i-phone"/></svg>통화</button>
		<button class="nav-item" data-go="policy"><svg><use href="#i-gear"/></svg>정책설정</button>
	</nav>
</aside>

<div class="main">
	<header class="top">
		<span class="org"><svg><use href="#i-building"/></svg><span id="org-name">공주시</span></span>
		<span class="sep"></span>
		<span class="org"><svg><use href="#i-user"/></svg><span id="agent-name">김상담</span></span>
		<span class="grow"></span>
		<span class="clock" id="clock">--:--</span>
		<button class="state-pill" id="state-pill" title="눌러서 상담대기·이석중 전환"><i></i><span id="state-text">연결 중</span></button>
	</header>

	<!-- 통화 -->
	<section class="view view-call">
		<div class="ring" id="ring" hidden role="alert">
			<span class="ring-wave left"></span>
			<div class="ring-card">
				<span class="ring-icon"><svg><use href="#i-phone"/></svg></span>
				<div class="ring-text"><strong>전화가 왔습니다.</strong><span class="mono" id="ring-call"></span></div>
				<button class="btn btn-green" id="accept"><svg><use href="#i-phone"/></svg>전화 받기</button>
			</div>
			<span class="ring-wave right"></span>
		</div>

		<div class="counters">
			<div class="counter" id="c-before"><p><svg><use href="#i-chat"/></svg>안내 전 폭언</p><strong><b id="abuse-count">0</b><i>/</i><span id="abuse-limit">-</span></strong></div>
			<div class="counter" id="c-after"><p><svg><use href="#i-speaker"/></svg>안내 후 폭언</p><strong><b id="after-count">0</b><i>/</i><span id="after-limit">-</span></strong></div>
			<div class="counter" id="c-agitation"><p><svg><use href="#i-clock"/></svg>감정 격양 지속</p><strong><b id="agitation-sec">0</b><i>/</i><span id="agitation-limit">-</span>초</strong></div>
		</div>

		<div class="cols">
			<div class="card call-card">
				<div class="policy-line"><svg><use href="#i-gear"/></svg><span id="policy-summary">정책 불러오는 중</span></div>
				<div class="call-state">
					<span class="call-icon"><svg><use href="#i-phone"/></svg></span>
					<strong id="call-state-text">상담 대기</strong>
					<span class="divider"></span>
					<span class="mono" id="call-timer">00:00:00</span>
				</div>
				<div class="caller">
					<span class="avatar"><svg><use href="#i-user"/></svg></span>
					<div><span class="mono" id="caller-id">-</span><small>민원인</small></div>
				</div>
				<div class="row">
					<span class="label">감정 상태</span>
					<div class="gauge">
						<svg viewBox="0 0 200 110" aria-hidden="true">
							<defs><linearGradient id="g-arc" x1="0" x2="1"><stop offset="0" stop-color="#22B04B"/><stop offset=".45" stop-color="#F6C21B"/><stop offset=".75" stop-color="#F58A1F"/><stop offset="1" stop-color="#E5262E"/></linearGradient></defs>
							<path d="M20 100 A80 80 0 0 1 180 100" fill="none" stroke="url(#g-arc)" stroke-width="16" stroke-linecap="round"/>
							<circle id="gauge-dot" cx="20" cy="100" r="9" fill="#1D5BD8" stroke="#fff" stroke-width="3"/>
						</svg>
						<span class="gauge-value" id="emotion-score">-</span>
					</div>
					<span class="tag" id="emotion-tag">대기</span>
				</div>
				<div class="row">
					<span class="label">음량</span>
					<span class="volume-word" id="volume-word">-</span>
					<div class="bar"><div id="volume-bar"></div></div>
					<span class="volume-pct" id="volume-pct">-</span>
				</div>
				<div class="row">
					<span class="label">보호조치</span>
					<span class="protect" id="protect"><svg><use href="#i-shield"/></svg><span id="protect-text">없음</span></span>
					<span class="grow"></span>
					<span class="info" title="폭언 의심·격양이면 민원인 목소리를 자동으로 막고, 정상으로 판단되면 자동으로 풉니다. 버튼으로 직접 막거나 풀 수 있습니다."><svg><use href="#i-info"/></svg></span>
				</div>
				<p class="caption" id="caption" aria-live="polite"></p>
				<div class="actions">
					<button class="btn btn-outline btn-wide" id="hold-btn" disabled><svg><use href="#i-badge"/></svg><span id="hold-btn-text">오탐지 (수동 해제)</span></button>
					<button class="btn btn-red" id="hangup" disabled title="통화 끊기"><svg style="transform:rotate(135deg)"><use href="#i-phone"/></svg></button>
				</div>
			</div>

			<div class="card log-card">
				<h2><svg><use href="#i-list"/></svg>음소거 구간 전사</h2>
				<ol class="events" id="events"></ol>
				<p class="empty" id="events-empty">폭언·감정 격양·오탐지 해제 구간이 여기에 쌓입니다.</p>
			</div>
		</div>
	</section>

	<!-- 정책설정 -->
	<section class="view view-policy">
		<h1 class="page-title"><svg><use href="#i-gear"/></svg>통화 보호정책 설정</h1>
		<div class="cols policy-cols">
			<div class="card form-card">
				<div class="field">
					<span class="field-label"><svg><use href="#i-chat"/></svg>폭언 허용 횟수<span class="info" title="이 횟수만큼 폭언이 쌓이면 '폭언 후 안내' 멘트가 나갑니다 (바로 차단이면 종료 안내 후 종료)."><svg><use href="#i-info"/></svg></span></span>
					<span class="stepper"><input type="number" id="p-abuse" min="1" max="10"><span><button data-step="p-abuse:1">▲</button><button data-step="p-abuse:-1">▼</button></span></span><em>회</em>
				</div>
				<h3>안내 후 차단 정책 <small>(필수 선택)</small></h3>
				<label class="choice" id="choice-immediate">
					<input type="radio" name="after" value="IMMEDIATE">
					<span><strong>바로 차단</strong><small>폭언 허용 횟수에 닿으면 종료 안내 후 즉시 세션을 종료합니다.</small></span>
				</label>
				<label class="choice" id="choice-count">
					<input type="radio" name="after" value="COUNT">
					<span><strong>안내 후 폭언 횟수</strong><small>폭언 안내 후 지정한 횟수의 추가 폭언 발생 시 세션을 종료합니다.</small>
						<span class="sub-field">추가 폭언 횟수<span class="stepper"><input type="number" id="p-after" min="1" max="10"><span><button data-step="p-after:1">▲</button><button data-step="p-after:-1">▼</button></span></span><em>회</em></span>
					</span>
				</label>
				<div class="field last">
					<span class="field-label"><svg><use href="#i-clock"/></svg>감정 격양 지속 시간<span class="info" title="감정 격양이 이 시간만큼 이어지면 폭언 1회로 셉니다."><svg><use href="#i-info"/></svg></span></span>
					<span class="stepper"><input type="number" id="p-agitation" min="3" max="60"><span><button data-step="p-agitation:1">▲</button><button data-step="p-agitation:-1">▼</button></span></span><em>초</em>
				</div>
			</div>
			<div class="card ann-card">
				<h2><svg><use href="#i-doc"/></svg>안내 멘트 설정</h2>
				<ul class="anns" id="anns"></ul>
			</div>
		</div>
		<div class="policy-foot">
			<span class="save-msg" id="save-msg" role="status"></span>
			<button class="btn btn-outline" id="p-reset"><svg><use href="#i-reset"/></svg>초기화</button>
			<button class="btn btn-blue" id="p-save"><svg><use href="#i-check"/></svg>저장</button>
		</div>
	</section>
</div>
<script src="ops.js"></script>
</body>
</html>
