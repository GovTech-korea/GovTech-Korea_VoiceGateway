spring:
  application:
    name: voicegateway

voicegateway:
  # 브라우저 테스트 콘솔(/test)과 현황·STT 기록 API. 인증이 없으니 외부에 여는 배포에서는 false
  test-console:
    enabled: true
  # 민원인 → 상담원 음성 지연 (ms). 이 시간 안에 위험 구간을 무음 처리한다
  delay-ms: 800
  # 상담원이 벨을 받지 않으면 다음 상담원에게 넘기는 시간 (ms)
  ring-timeout-ms: 20000
  stt:
    # STT로 보내는 형식: PCM16_16K(받은 그대로) | PCM16_8K(16k → 8k 다운샘플)
    format: PCM16_16K
    # 지정하면 통화마다 STT로 보낸 바이트를 <callId>-<시작 ms>.pcm으로 남긴다 (예: runtime/stt-dump, runtime/은 git 제외)
    # dump-dir: runtime/stt-dump
  emotion:
    # STT 서버의 감정 판정 API (streaming-asr POST /v1/acoustic-arousal). 없거나 실패하면 목업(목소리 크기·문장)으로 판단
    # url: http://127.0.0.1:8100/v1/acoustic-arousal
    # 이 점수 이상이면 격양
    agitated-score: 70
  policy:
    # 정책 API(/api/v1/policy)를 브라우저에서 부를 수 있는 웹 주소. 웹 주소가 정해지면 그 주소로 좁힌다 (예: https://web.example.com)
    allowed-origins: "*"
