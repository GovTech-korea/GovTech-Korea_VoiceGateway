<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>민원인 화면 · Voice Gateway</title>
<link rel="stylesheet" href="console.css">
</head>
<body>
<main class="solo">
	<header class="solo-head">
		<a class="back" href="index.html">← 역할 선택</a>
		<div class="server">
			<span class="dot" id="server-dot"></span>
			<span id="server-text">상태 확인 중</span>
		</div>
	</header>
	<h1>📞 민원인 화면</h1>

	<ol class="steps compact">
		<li>말할 방법을 고릅니다: <strong>마이크</strong>(권장), 테스트 톤, 오디오 파일</li>
		<li><strong>전화 걸기</strong>를 누릅니다. 상담원이 모두 바쁘면 대기 순번이 표시됩니다</li>
		<li>"통화 중"이 되면 말하세요. 상담원에게는 <strong>약 <span id="delay-ms">0.8초</span> 늦게</strong> 들립니다</li>
		<li>끝나면 <strong>끊기</strong>. 상담원이 먼저 끊을 수도 있습니다</li>
	</ol>

	<section class="panel" id="citizen-panel">
		<div class="panel-head">
			<h2>전화</h2>
			<span class="badge" id="citizen-state">전화 안 함</span>
		</div>
		<div class="call-status">
			<span class="mono big-timer" id="citizen-timer"></span>
		</div>
		<div class="row">
			<label>음성
				<select id="citizen-source">
					<option value="mic">마이크</option>
					<option value="tone">테스트 톤 (440Hz, 0.5초 간격)</option>
					<option value="file">오디오 파일</option>
				</select>
			</label>
			<input type="file" id="citizen-file" accept="audio/*" hidden>
		</div>
		<div class="row">
			<button id="citizen-call" class="primary big-button">전화 걸기</button>
			<button id="citizen-hangup" class="danger big-button">끊기</button>
		</div>
		<div class="meter"><div class="meter-fill" id="citizen-meter"></div></div>
		<details>
			<summary class="hint">통화 ID (자동 생성)</summary>
			<div class="row">
				<label>통화 ID <input id="citizen-call-id" maxlength="64"></label>
				<button id="citizen-new-id" title="새 통화 ID">새 ID</button>
			</div>
		</details>
	</section>

	<section class="panel timeline-panel">
		<div class="panel-head">
			<h2>내가 보낸 소리 (최근 10초)</h2>
			<div class="legend">
				<span><i class="sw sw-sent"></i>보낸 소리</span>
			</div>
		</div>
		<canvas id="timeline" class="short"></canvas>
	</section>

	<details class="panel">
		<summary>주고받은 메시지 (개발용)</summary>
		<ol class="log" id="citizen-log"></ol>
	</details>
</main>
<script src="console.js"></script>
</body>
</html>
